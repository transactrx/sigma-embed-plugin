<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sigma Embed Preview</title>
  <style>
    body { margin: 0; overflow: hidden; }
    iframe { width: 100%; height: 100vh; border: none; }
    .placeholder {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; font-family: sans-serif; color: #888;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div id="placeholder" class="placeholder">Select a report to preview</div>
  <iframe id="preview" style="display:none"></iframe>

  <script src="https://cdn.sigmacomputing.com/embed-sdk/v0/sigma-plugin.js"></script>
  <script>
    const frame = document.getElementById('preview');
    const placeholder = document.getElementById('placeholder');

    sigmaPlugin.on('data', function(data) {
      var url = data && data[0] && data[0][0];
      if (url && url !== frame.src) {
        frame.src = url;
        frame.style.display = 'block';
        placeholder.style.display = 'none';
      }
    });

    sigmaPlugin.ready();
  </script>
</body>
</html>
